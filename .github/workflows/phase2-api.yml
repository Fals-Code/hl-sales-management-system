name: Phase 2 API CI

on:
  push:
    branches: [phase-2-api]
  pull_request:
    branches: [main, phase-2-api]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hl_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hl_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hl_dev?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hl_test?schema=public
      APP_USERNAME: owner
      APP_PASSWORD: change-this-ci-password
      OWNER_PIN: "123456"
      SESSION_COOKIE_NAME: hl_session
      SESSION_COOKIE_SECURE: "false"
      SESSION_MAX_AGE: "43200"
      FRONTEND_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create test database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d hl_dev -c 'CREATE DATABASE hl_test;'

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Apply migrations
        run: npm run db:migrate:deploy

      - name: Seed development database
        run: npm run db:seed

      - name: Run validation suite
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
