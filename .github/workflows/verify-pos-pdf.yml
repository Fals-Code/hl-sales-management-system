name: Verify POS and PDF

on:
  pull_request:
    branches:
      - phase-5-api-integration
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d hl_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hl_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hl_test?schema=public
      SESSION_SECRET: ci-session-secret-that-is-long-enough
      OWNER_PIN: "246810"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Verify backend types
        run: npm run build

      - name: Run backend tests
        run: npm test

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run frontend tests
        working-directory: frontend
        run: npm test
