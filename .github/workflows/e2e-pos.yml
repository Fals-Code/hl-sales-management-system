name: E2E POS Flow

on:
  pull_request:
    branches:
      - phase-5-api-integration
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hl_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d hl_e2e"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hl_e2e?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hl_e2e?schema=public
      SESSION_SECRET: e2e-session-secret-that-is-long-enough
      APP_USERNAME: owner
      APP_PASSWORD: phase5-test-password
      PHASE5_TEST_USERNAME: owner
      PHASE5_TEST_PASSWORD: phase5-test-password
      OWNER_PIN: "246810"
      SESSION_COOKIE_SECURE: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Prepare database
        run: |
          npm run db:generate
          npm run db:migrate:deploy
          npm run db:seed

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run API-connected Playwright flow
        working-directory: frontend
        run: npm run test:e2e:api

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-api-report
          path: |
            frontend/playwright-api-report
            frontend/test-results-api
          if-no-files-found: ignore
