name: Phase 5 Integration Validation

on:
  push:
    branches: [phase-4-audit-fix, phase-4-readiness-fix, phase-5-api-integration]
  pull_request:
    branches: [phase-4-frontend, phase-4-audit-fix]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hl_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hl_app?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hl_app?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run db:generate
      - run: npm run db:migrate:deploy
      - run: npm run typecheck
      - run: npm run lint
      - name: Run backend tests
        id: backend_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee backend-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-report
          path: backend-test.log
      - name: Enforce backend test result
        if: steps.backend_tests.outcome == 'failure'
        run: exit 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - name: Run frontend unit tests
        id: frontend_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee frontend-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-report
          path: frontend/frontend-test.log
      - name: Enforce frontend unit test result
        if: steps.frontend_tests.outcome == 'failure'
        run: exit 1
      - run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser and visual regression
        id: visual_tests
        continue-on-error: true
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase5-visual-regression
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: warn
      - name: Enforce browser regression result
        if: steps.visual_tests.outcome == 'failure'
        run: exit 1

  phase5-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hl_phase5_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hl_phase5_e2e?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hl_phase5_e2e?schema=public
      APP_USERNAME: owner
      APP_PASSWORD: phase5-test-password
      OWNER_PIN: "246810"
      FRONTEND_ORIGIN: http://127.0.0.1:4174
      SESSION_COOKIE_SECURE: "false"
      PHASE5_TEST_USERNAME: owner
      PHASE5_TEST_PASSWORD: phase5-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run db:generate
      - run: npm run db:migrate:deploy
      - run: npm run db:seed
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run real API browser flow
        id: api_browser_tests
        continue-on-error: true
        working-directory: frontend
        run: npm run test:e2e:api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase5-api-browser-report
          path: |
            frontend/test-results-api
            frontend/playwright-api-report
          if-no-files-found: warn
      - name: Enforce real API browser result
        if: steps.api_browser_tests.outcome == 'failure'
        run: exit 1
