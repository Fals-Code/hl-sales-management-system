name: Phase 4 Readiness Validation

on:
  push:
    branches: [phase-4-audit-fix, phase-4-readiness-fix]
  pull_request:
    branches: [phase-4-frontend, phase-4-audit-fix]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hl_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hl_app?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hl_app?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate:deploy
      - run: npm run typecheck
      - run: npm run lint
      - name: Run backend tests
        id: backend_tests
        continue-on-error: true
        run: npm test -- --reporter=json --outputFile=vitest-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-report
          path: vitest-report.json
      - name: Enforce backend test result
        if: steps.backend_tests.outcome == 'failure'
        run: exit 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
