name: Diagnose Phase 6 Readiness

on:
  push:
    branches:
      - fix/phase6-readiness
  workflow_dispatch:

jobs:
  lint-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Capture lint output
        shell: bash
        run: |
          set +e
          npm run lint > lint-report.txt 2>&1
          code=$?
          cat lint-report.txt
          echo "LINT_EXIT_CODE=$code" >> "$GITHUB_ENV"
          exit 0
      - name: Upload lint report
        uses: actions/upload-artifact@v4
        with:
          name: phase6-lint-report
          path: lint-report.txt
      - name: Enforce lint result
        run: exit "$LINT_EXIT_CODE"
