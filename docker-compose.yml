services:
  postgres:
    image: postgres:16
    container_name: hl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hl_dev
    ports:
      - "5432:5432"
    volumes:
      - hl_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hl_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hl_postgres_data:
